    <rect x="760" y="64" width="210" height="38" rx="19" fill="#FFFFFF" stroke="#102448" stroke-opacity=".08"/>
    <circle cx="782" cy="83" r="6" fill="none" stroke="#102448" stroke-opacity=".45" stroke-width="1.4"/>
    <path d="M787 88l5 5" stroke="#102448" stroke-opacity=".45" stroke-width="1.4" stroke-linecap="round"/>
    <text x="800" y="87" fill="#102448" fill-opacity=".35" font-family="Arial, Helvetica, sans-serif" font-size="10.5">Search products…</text>
