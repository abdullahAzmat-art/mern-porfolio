    <rect x="438" y="284" width="30" height="66" rx="15" fill="url(#ec-metal)"/>
    <rect x="592" y="284" width="30" height="66" rx="15" fill="url(#ec-metal)"/>
    <rect x="446" y="300" width="14" height="34" rx="7" fill="#102448" opacity=".6"/>
    <rect x="600" y="300" width="14" height="34" rx="7" fill="#102448" opacity=".6"/>
    <circle cx="530" cy="262" r="38" fill="#2479E8" opacity=".18"/>
    <circle cx="530" cy="262" r="24" fill="none" stroke="#C8E0FA" stroke-opacity=".45"/>
