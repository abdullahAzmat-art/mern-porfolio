<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="NOVA e-commerce platform with product catalogue and cart">
  <defs>
    <linearGradient id="ec-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FBFF"/>
      <stop offset=".6" stop-color="#EAF4FF"/>
      <stop offset="1" stop-color="#C8E0FA"/>
    </linearGradient>
    <linearGradient id="ec-hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102448"/>
      <stop offset=".65" stop-color="#173A6E"/>
      <stop offset="1" stop-color="#2479E8"/>
    </linearGradient>
    <linearGradient id="ec-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF4FF"/>
      <stop offset=".5" stop-color="#A9C9EE"/>
      <stop offset="1" stop-color="#6E9CD4"/>
    </linearGradient>
    <filter id="ec-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#102448" flood-opacity=".16"/>
    </filter>
    <filter id="ec-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#102448" flood-opacity=".1"/>
    </filter>
    <radialGradient id="ec-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#C8E0FA" stop-opacity=".45"/>
      <stop offset="1" stop-color="#C8E0FA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#ec-bg)"/>
  <circle cx="1080" cy="110" r="260" fill="#A9C9EE" opacity=".22"/>
  <circle cx="120" cy="700" r="220" fill="#A9C9EE" opacity=".18"/>

  <!-- header -->
  <g>
    <text x="82" y="86" fill="#102448" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" letter-spacing="-1">NOVA<tspan fill="#2479E8">.</tspan></text>
    <text x="82" y="102" fill="#102448" fill-opacity=".4" font-family="Arial, Helvetica, sans-serif" font-size="7" letter-spacing="2.6">EVERYDAY TECH</text>
    <g font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#102448" fill-opacity=".6">
