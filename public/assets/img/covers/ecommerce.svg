  <circle cx="828" cy="340" r="6" fill="#2479E8"/>
  <text x="862" y="332" fill="#102448" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700">Pulse Buds Pro</text>
  <text x="862" y="348" fill="#102448" fill-opacity=".45" font-family="Arial, Helvetica, sans-serif" font-size="9.5">ANC · 32h battery</text>
  <text x="862" y="364" fill="#2479E8" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700">PKR 9,450</text>
  <rect x="1050" y="322" width="26" height="20" rx="6" fill="#EAF4FF"/>
