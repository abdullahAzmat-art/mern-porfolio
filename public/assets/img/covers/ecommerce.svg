    <rect x="530" y="434" width="178" height="112" rx="11" fill="#EAF4FF"/>
    <rect x="584" y="456" width="70" height="74" rx="26" fill="#102448"/>
    <circle cx="619" cy="482" r="14" fill="none" stroke="#A9C9EE" stroke-width="1.4"/>
    <circle cx="619" cy="482" r="5" fill="#2479E8"/>
    <circle cx="619" cy="510" r="5" fill="#A9C9EE" opacity=".5"/>
    <path d="M602 530h34" stroke="#2479E8" stroke-width="2" stroke-linecap="round"/>
    <rect x="530" y="560" width="58" height="18" rx="9" fill="#EAF4FF"/>
    <text x="559" y="573" fill="#2479E8" font-size="8" font-weight="700" text-anchor="middle">TRENDING</text>
