  <rect x="808" y="416" width="22" height="30" rx="9" fill="#102448"/>
  <circle cx="819" cy="428" r="5" fill="none" stroke="#A9C9EE" stroke-width="1.2"/>
  <text x="862" y="422" fill="#102448" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700">Orbit Mini</text>
  <text x="862" y="438" fill="#102448" fill-opacity=".45" font-family="Arial, Helvetica, sans-serif" font-size="9.5">Portable · 360° sound</text>
  <text x="862" y="454" fill="#2479E8" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700">PKR 7,200</text>
  <rect x="1050" y="412" width="26" height="20" rx="6" fill="#EAF4FF"/>
  <text x="1063" y="426" fill="#102448" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" text-anchor="middle">1</text>
  <line x1="790" y1="476" x2="1092" y2="476" stroke="#102448" stroke-opacity=".08"/>

  <text x="790" y="506" fill="#102448" fill-opacity=".5" font-family="Arial, Helvetica, sans-serif" font-size="10.5">Subtotal</text>
  <text x="1092" y="506" fill="#102448" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="end">PKR 35,550</text>
  <text x="790" y="528" fill="#102448" fill-opacity=".5" font-family="Arial, Helvetica, sans-serif" font-size="10.5">Shipping</text>
  <text x="1092" y="528" fill="#2479E8" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" text-anchor="end">FREE</text>
  <line x1="790" y1="544" x2="1092" y2="544" stroke="#102448" stroke-opacity=".08"/>
  <text x="790" y="572" fill="#102448" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800">Total</text>
  <text x="1092" y="572" fill="#102448" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" text-anchor="end">PKR 35,550</text>
  <rect x="790" y="590" width="302" height="44" rx="12" fill="#2479E8"/>
  <text x="941" y="617" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Secure checkout →</text>
  <text x="941" y="652" fill="#102448" fill-opacity=".35" font-family="Arial, Helvetica, sans-serif" font-size="8.5" text-anchor="middle">Visa · Mastercard · Cash on delivery</text>

