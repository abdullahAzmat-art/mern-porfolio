  <text x="114" y="326" fill="#A9C9EE" fill-opacity=".65" font-family="Arial, Helvetica, sans-serif" font-size="11">Aero headphones. 40-hour battery. Studio-grade clarity.</text>
  <rect x="114" y="346" width="144" height="34" rx="17" fill="#FFFFFF"/>
  <text x="186" y="368" fill="#102448" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Shop now →</text>

