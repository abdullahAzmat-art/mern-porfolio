    <path d="M1002 78h16l2 14h-20z" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M1007 78c0-6 6-6 6 0" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
    <circle cx="1022" cy="68" r="7" fill="#2479E8"/>
    <text x="1022" y="72" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" text-anchor="middle">2</text>
    <circle cx="1068" cy="82" r="17" fill="#EAF4FF" stroke="#102448" stroke-opacity=".08"/>
    <circle cx="1068" cy="77" r="5" fill="none" stroke="#102448" stroke-opacity=".5" stroke-width="1.2"/>
