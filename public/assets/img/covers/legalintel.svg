<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="LegalIntel AI document intelligence interface">
  <defs>
    <linearGradient id="li-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111F"/>
      <stop offset=".55" stop-color="#102448"/>
      <stop offset="1" stop-color="#0B2B5E"/>
    </linearGradient>
    <radialGradient id="li-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2479E8" stop-opacity=".65"/>
      <stop offset="1" stop-color="#2479E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="li-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8E0FA"/>
      <stop offset="1" stop-color="#2479E8"/>
    </linearGradient>
    <linearGradient id="li-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9C9EE"/>
      <stop offset="1" stop-color="#2479E8"/>
    </linearGradient>
    <filter id="li-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="30" stdDeviation="35" flood-color="#000814" flood-opacity=".55"/>
    </filter>
    <pattern id="li-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#A9C9EE" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#li-bg)"/>
  <rect width="1200" height="800" fill="url(#li-grid)"/>
  <circle cx="1040" cy="90" r="280" fill="url(#li-glow)"/>
  <circle cx="120" cy="760" r="220" fill="url(#li-glow)" opacity=".45"/>

  <!-- app window -->
