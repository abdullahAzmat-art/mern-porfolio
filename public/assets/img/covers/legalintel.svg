  </g>
  <rect x="96" y="70" width="1008" height="54" rx="22" fill="#0A192E"/>
  <rect x="96" y="102" width="1008" height="22" fill="#0A192E"/>
  <circle cx="128" cy="97" r="5.5" fill="#A9C9EE" opacity=".5"/>
