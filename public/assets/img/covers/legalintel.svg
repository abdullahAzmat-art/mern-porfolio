    <rect x="914" y="398" width="148" height="6" rx="3" fill="#102448"/>
    <rect x="914" y="398" width="78" height="6" rx="3" fill="#A9C9EE"/>
    <text x="914" y="434" fill="#A9C9EE" fill-opacity=".7">Liability cap</text>
    <rect x="914" y="442" width="148" height="6" rx="3" fill="#102448"/>
    <rect x="914" y="442" width="126" height="6" rx="3" fill="#C8E0FA"/>
  </g>

  <rect x="914" y="472" width="148" height="52" rx="9" fill="#2479E8" fill-opacity=".12" stroke="#2479E8" stroke-opacity=".28"/>
  <text x="926" y="492" fill="#C8E0FA" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700">3 clauses</text>
  <text x="926" y="508" fill="#A9C9EE" fill-opacity=".6" font-family="Arial, Helvetica, sans-serif" font-size="9.5">need your attention</text>
  <rect x="914" y="542" width="148" height="38" rx="9" fill="none" stroke="#A9C9EE" stroke-opacity=".2"/>
  <text x="988" y="566" fill="#EAF4FF" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle">Export report</text>

