  <circle cx="386" cy="330" r="15" fill="url(#li-accent)"/>
  <path d="M386 322l2.4 5.2 5.6.7-4.2 3.8 1.1 5.5-4.9-2.8-4.9 2.8 1.1-5.5-4.2-3.8 5.6-.7z" fill="#0D1E38"/>
  <text x="414" y="326" fill="#A9C9EE" fill-opacity=".6" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.6">LEGALINTEL AI</text>
  <text x="414" y="348" fill="#EAF4FF" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="600">The agreement requires a 60-day written notice.</text>
  <rect x="414" y="362" width="430" height="9" rx="4.5" fill="#A9C9EE" fill-opacity=".22"/>
  <rect x="414" y="381" width="390" height="9" rx="4.5" fill="#A9C9EE" fill-opacity=".16"/>
  <rect x="414" y="400" width="330" height="9" rx="4.5" fill="#A9C9EE" fill-opacity=".12"/>

  <rect x="414" y="430" width="166" height="34" rx="8" fill="#2479E8" fill-opacity=".14" stroke="#2479E8" stroke-opacity=".35"/>
