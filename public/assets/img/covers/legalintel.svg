  <text x="132" y="472" fill="#EAF4FF" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="600">Sterling v. Capital</text>
  <text x="132" y="490" fill="#A9C9EE" fill-opacity=".55" font-family="Arial, Helvetica, sans-serif" font-size="10">24 pages · 3 documents</text>
  <rect x="118" y="520" width="192" height="46" rx="10" fill="none" stroke="#A9C9EE" stroke-opacity=".12" stroke-dasharray="4 4"/>
  <text x="214" y="548" fill="#A9C9EE" fill-opacity=".55" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">+ Upload document</text>

