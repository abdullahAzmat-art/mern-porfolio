  <text x="914" y="176" fill="#EAF4FF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Clause risk</text>
  <text x="914" y="194" fill="#A9C9EE" fill-opacity=".45" font-family="Arial, Helvetica, sans-serif" font-size="9.5" letter-spacing=".5">AI ANALYSIS</text>

  <circle cx="988" cy="262" r="48" fill="none" stroke="#102448" stroke-width="10"/>
  <circle cx="988" cy="262" r="48" fill="none" stroke="url(#li-ring)" stroke-width="10" stroke-linecap="round" stroke-dasharray="211 302" transform="rotate(-90 988 262)"/>
  <text x="988" y="260" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle">72</text>
  <text x="988" y="278" fill="#A9C9EE" fill-opacity=".55" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle">RISK SCORE</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="10.5">
    <text x="914" y="346" fill="#A9C9EE" fill-opacity=".7">Indemnity</text>
