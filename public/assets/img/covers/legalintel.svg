  <text x="458" y="452" fill="#C8E0FA" font-family="Arial, Helvetica, sans-serif" font-size="11">Clause 7.2 · p. 14</text>
  <rect x="592" y="430" width="130" height="34" rx="8" fill="#2479E8" fill-opacity=".14" stroke="#2479E8" stroke-opacity=".35"/>
  <path d="M606 440h8v14h-8zM618 445h8v9h-8z" fill="none" stroke="#A9C9EE" stroke-width="1.2"/>
  <text x="636" y="452" fill="#C8E0FA" font-family="Arial, Helvetica, sans-serif" font-size="11">p. 22 · Annex B</text>

  <!-- input -->
  <rect x="368" y="598" width="502" height="54" rx="16" fill="#0A192E" stroke="#A9C9EE" stroke-opacity=".16"/>
  <text x="390" y="630" fill="#A9C9EE" fill-opacity=".45" font-family="Arial, Helvetica, sans-serif" font-size="12.5">Ask a follow-up question…</text>
  <circle cx="842" cy="625" r="17" fill="#2479E8"/>
  <path d="M835 625h14M844 620l5 5-5 5" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="368" y="684" fill="#A9C9EE" fill-opacity=".4" font-family="Arial, Helvetica, sans-serif" font-size="10.5">Grounded in 24 pages · citations verified · zero hallucinations</text>

