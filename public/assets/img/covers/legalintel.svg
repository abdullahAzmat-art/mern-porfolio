  <circle cx="168" cy="97" r="5.5" fill="#A9C9EE" opacity=".2"/>
  <rect x="420" y="84" width="360" height="26" rx="13" fill="#102448" stroke="#A9C9EE" stroke-opacity=".12"/>
  <text x="600" y="102" fill="#A9C9EE" fill-opacity=".65" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" letter-spacing=".5">legalintel.ai / matters / sterling-v-capital</text>

  <!-- sidebar -->
  <rect x="96" y="124" width="236" height="606" fill="#0B1A31"/>
  <rect x="118" y="150" width="30" height="30" rx="9" fill="#2479E8"/>
  <path d="M129 158v14M133 158v14M137 158v14M127 172h12" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  <text x="160" y="171" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="-.2">LegalIntel</text>
  <rect x="118" y="204" width="192" height="34" rx="9" fill="#2479E8" fill-opacity=".16"/>
