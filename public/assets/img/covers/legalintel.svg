  <circle cx="912" cy="629" r="16" fill="#2479E8"/>
  <path d="M912 620l2.6 5.7 6.2.8-4.6 4.2 1.2 6.1-5.4-3.1-5.4 3.1 1.2-6.1-4.6-4.2 6.2-.8z" fill="#fff"/>
  <text x="940" y="625" fill="#102448" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700">Answer verified</text>
  <text x="940" y="642" fill="#102448" fill-opacity=".55" font-family="Arial, Helvetica, sans-serif" font-size="10">2 citations · 1.2s response</text>
